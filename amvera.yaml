name: reels-gen-bot
runtime: python3.11

build:
  commands:
    - pip install -r requirements.txt

run:
  command: python bot.py

env:
  - TELEGRAM_BOT_TOKEN
  - AI_PROVIDER
  - GROQ_API_KEY
  - GROQ_MODEL
  - OPENAI_API_KEY
  - OPENAI_MODEL
  - YANDEX_API_KEY
  - YANDEX_FOLDER_ID
  - YANDEX_MODEL
  - MAX_REQUESTS_PER_USER
  - DEVELOPER_USER_IDS
  - PAYMENT_PROVIDER_TOKEN
  - SUBSCRIPTION_PRICE
  - SUBSCRIPTION_DURATION_DAYS

